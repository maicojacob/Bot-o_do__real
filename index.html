
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botão do Real</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eeeeee;
  text-align: center;
}

.caixa {
  margin: 50px 20px;
  padding: 30px;
  background: white;
  border-radius: 20px;
}

h1 {
  font-size: 30px;
}

#valor {
  font-size: 40px;
  font-weight: bold;
  margin: 30px;
}

button {
  font-size: 25px;
  padding: 20px 35px;
  border: none;
  border-radius: 20px;
  background: green;
  color: white;
}
</style>
</head>

<body>

<div class="caixa">

<h1>💰 Botão do Real</h1>

<p>Clique para ganhar R$ 1,00</p>

<div id="valor">R$ 0,00</div>

<button onclick="adicionar()">+ R$ 1</button>

</div>

<script>

let dinheiro = 0;

function adicionar() {
  dinheiro = dinheiro + 1;

  document.getElementById("valor").innerHTML =
  "R$ " + dinheiro + ",00";
}

</script>

</body>
</html>
