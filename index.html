<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">

<title>Botão do Real</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
}

.app{
  max-width:500px;
  margin:auto;
  min-height:100vh;
  padding:18px;
}

.topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.pontos{
  background:#222;
  padding:10px 14px;
  border-radius:20px;
  white-space:nowrap;
}

.card{
  margin-top:20px;
  padding:24px 18px;
  border-radius:25px;
  background:#222;
  text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}

h1{
  margin:5px 0;
  font-size:27px;
}

.subtitulo{
  color:#aaa;
  font-size:14px;
  margin-top:8px;
}

.frase{
  min-height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  line-height:1.4;
  margin:20px 0;
  padding:10px;
}

.botao{
  width:100%;
  padding:19px;
  border:0;
  border-radius:18px;
  font-size:21px;
  font-weight:bold;
  background:#20c56a;
  color:white;
  box-shadow:0 5px 0 #15924c;
  cursor:pointer;
}

.botao:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #15924c;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.caixinha{
  background:#222;
  padding:15px;
  border-radius:15px;
  text-align:center;
}

.caixinha strong{
  font-size:20px;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.menu button{
  padding:15px 8px;
  border:0;
  border-radius:15px;
  background:#333;
  color:white;
  font-size:15px;
  cursor:pointer;
}

.menu button:active{
  transform:scale(.97);
}

.bonus{
  margin-top:15px;
  padding:15px;
  border-radius:15px;
  background:#302700;
  color:#ffd84d;
  text-align:center;
  font-weight:bold;
}

.pequeno{
  margin-top:20px;
  font-size:13px;
  color:#888;
  text-align:center;
  line-height:1.5;
}

#mensagem{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#20c56a;
  color:white;
  padding:14px 20px;
  border-radius:30px;
  font-weight:bold;
  display:none;
  z-index:999;
  box-shadow:0 5px 20px rgba(0,0,0,.4);
  text-align:center;
  width:max-content;
  max-width:90%;
}

.rodape{
  text-align:center;
  color:#666;
  font-size:11px;
  margin-top:25px;
}
</style>
</head>

<body>

<div class="app">

  <div class="topo">
    <div class="logo">💰 Botão do Real</div>

    <div class="pontos">
      ⭐ <span id="xp">0</span> XP
    </div>
  </div>

  <div class="card">

    <h1>😂 Frase do Dia</h1>

    <div class="subtitulo">
      Aperte e descubra uma frase para rir
    </div>

    <div class="frase" id="frase">
      Clique no botão e descubra sua frase! 😂
    </div>

    <button class="botao" onclick="novaFrase()">
      💵 GANHAR R$ 1
    </button>

  </div>

  <div class="bonus" id="bonus">
    🎁 Bônus diário disponível!
  </div>

  <div class="info">

    <div class="caixinha">
      🔥 Sequência<br>
      <strong><span id="sequencia">0</span></strong> dias
    </div>

    <div class="caixinha">
      🎯 Frases<br>
      <strong><span id="contador">0</span></strong>
    </div>

  </div>

  <div class="menu">

    <button onclick="favoritar()">
      ❤️ Favoritar
    </button>

    <button onclick="compartilhar()">
      📤 Compartilhar
    </button>
