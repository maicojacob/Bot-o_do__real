<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Botão do Real</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:white;
}

.app{
max-width:500px;
margin:auto;
min-height:100vh;
padding:18px;
}

.topo{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.logo{
font-size:22px;
font-weight:bold;
}

.pontos{
background:#222;
padding:10px 14px;
border-radius:20px;
white-space:nowrap;
}

.card{
margin-top:20px;
padding:24px 18px;
border-radius:25px;
background:#222;
text-align:center;
box-shadow:0 8px 30px rgba(0,0,0,.3);
}

h1{
margin:5px 0;
font-size:27px;
}

.subtitulo{
color:#aaa;
font-size:14px;
margin-top:8px;
}

.frase{
min-height:120px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
line-height:1.4;
margin:20px 0;
padding:10px;
}

.botao{
width:100%;
padding:19px;
border:0;
border-radius:18px;
font-size:21px;
font-weight:bold;
background:#20c56a;
color:white;
box-shadow:0 5px 0 #15924c;
cursor:pointer;
}

.botao:active{
transform:translateY(4px);
box-shadow:0 1px 0 #15924c;
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

.caixinha{
background:#222;
padding:15px;
border-radius:15px;
text-align:center;
}

.caixinha strong{
font-size:20px;
}

.menu{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

.menu button{
padding:15px 8px;
border:0;
border-radius:15px;
background:#333;
color:white;
font-size:15px;
cursor:pointer;
}

.menu button:active{
transform:scale(.97);
}

.bonus{
margin-top:15px;
padding:15px;
border-radius:15px;
background:#302700;
color:#ffd84d;
text-align:center;
font-weight:bold;
}

.pequeno{
margin-top:20px;
font-size:13px;
color:#888;
text-align:center;
line-height:1.5;
}

#mensagem{
position:fixed;
left:50%;
bottom:25px;
transform:translateX(-50%);
background:#20c56a;
color:white;
padding:14px 20px;
border-radius:30px;
font-weight:bold;
display:none;
z-index:999;
box-shadow:0 5px 20px rgba(0,0,0,.4);
text-align:center;
width:max-content;
max-width:90%;
}

.rodape{
text-align:center;
color:#666;
font-size:11px;
margin-top:25px;
}
</style>
</head>

<body>

<div class="app">

<div class="topo">

<div class="logo">
💰 Botão do Real
</div>

<div class="pontos">
⭐ <span id="xp">0</span> XP
</div>

</div>

<div class="card">

<h1>😂 Frase do Dia</h1>

<div class="subtitulo">
Aperte e descubra uma frase para rir
</div>

<div class="frase" id="frase">
Clique no botão e descubra sua frase! 😂
</div>

<button class="botao" onclick="novaFrase()">
💵 GANHAR R$ 1
</button>

</div>

<div class="bonus" id="bonus">
🎁 Bônus diário disponível!
</div>

<div class="info">

<div class="caixinha">
🔥 Sequência<br>
<strong><span id="sequencia">0</span></strong> dias
</div>

<div class="caixinha">
🎯 Frases<br>
<strong><span id="contador">0</span></strong>
</div>

</div>

<div class="menu">

<button onclick="favoritar()">
❤️ Favoritar
</button>

<button onclick="compartilhar()">
📤 Compartilhar
</button>

<button onclick="missao()">
🎯 Missão
</button>

<button onclick="sobre()">
ℹ️ Sobre
</button>

</div>

<div class="pequeno">
🔥 Volte amanhã para ganhar seu bônus diário e aumentar sua sequência!
</div>

<div class="rodape">
Botão do Real © 2026
</div>

</div>

<div id="mensagem"></div>

<script>

const frases = [

"Meu salário entrou e já está procurando a saída. 😂",
"Eu ia economizar, mas encontrei uma promoção. 🤣",
"Hoje eu vou dormir cedo. Eu, todos os dias. 😴",
"Não estou atrasado. Estou chegando no meu horário alternativo. 😂",
"Minha conta bancária está fazendo dieta: só tem saldo leve. 💸",
"Trabalhar eu trabalho. O problema é gostar. 😂",
"Se dinheiro não traz felicidade, me dê o dinheiro que eu testo. 🤣",
"Meu despertador toca e eu finjo que não conheço. 😴",
"Eu tenho planos. O problema é que meu sofá também tem. 😂",
"Segunda-feira deveria começar depois do almoço. 😅",
"Eu não sou preguiçoso. Estou economizando energia. 🔋",
"Minha motivação está de férias. 😂",
"Se fosse fácil, todo mundo estaria fazendo. 😎",
"Hoje eu estou igual Wi-Fi ruim: sem conexão com a realidade. 🤣",
"Meu cartão de crédito sabe mais sobre mim do que minha família. 😂",
"Eu só queria cinco minutinhos... três horas depois. 😴",
"Não tenho sorte no amor, mas tenho boleto. 💸",
"Minha dieta começa amanhã. De novo. 😂",
"Eu não discuto. Apenas explico por que estou certo. 😎",
"Vida adulta: pagar boleto e fingir que está tudo bem. 😂",
"Meu banco me mandou uma notificação. Até ele sente minha falta. 😂",
"Eu queria ficar rico, mas o dinheiro não colabora. 💸",
"Minha cama tem um campo magnético muito forte. 😴",
"Hoje eu acordei disposto. Depois passou. 😂",
"Eu não preciso de terapia, preciso ganhar na loteria. 🤣",
"Meu dinheiro é igual sabonete: quando vejo, já foi. 😂",
"Se preguiça fosse profissão, eu estaria trabalhando em casa. 😴",
"Meu problema não é gastar. É ter pouco para gastar. 😂",
"Eu faço planos financeiros. O mercado faz outros. 💸",
"Minha carteira está tão vazia que está ecoando. 🤣",
"Eu ia fazer exercício, mas pensei melhor. 😂",
"Meu celular tem mais bateria que eu. 🔋",
"Não estou com fome. Só estou pensando em comida. 😂",
"Adulto é uma criança com boletos. 💸",
"Eu não ronco. Meu corpo está apenas testando o motor. 🤣",
"Hoje eu estou 100% focado... em ir embora. 😂",
"Minha paciência está carregando. 1%. 😅",
"Eu não cheguei atrasado. O relógio que adiantou. 😂",
"Se dormir fosse esporte, eu seria campeão. 🏆",
"Meu futuro depende de mim. Por isso estou preocupado. 🤣",
"Eu queria férias das férias. 😂",
"Minha motivação pediu demissão sem aviso prévio. 😅",
"Quando dizem 'é rapidinho', eu já sei que perdi a tarde. 😂",
"Eu não sou indeciso. Talvez. 🤣",
"Minha vida financeira é uma montanha-russa sem cinto. 💸",
"Eu tenho memória excelente. Só esqueci onde coloquei. 😂",
"Hoje eu estou igual impressora: sem vontade de trabalhar. 🤣",
"Meu despertador é meu maior inimigo. 😴",
"Eu queria ser produtivo, mas a internet tinha outros planos. 😂"

];

let xp = 0;
let contador = 0;
let sequencia = 0;
let ultimaData = "";
let favorita = "";

function carregarDados(){

try{

xp = Number(localStorage.getItem("xp")) || 0;
contador = Number(localStorage.getItem("contador")) || 0;
sequencia = Number(localStorage.getItem("sequencia")) || 0;
ultimaData = localStorage.getItem("ultimaData") || "";
favorita = localStorage.getItem("favorita") || "";

}catch(e){

xp = 0;
contador = 0;
sequencia = 0;
ultimaData = "";
favorita = "";

}

}

function salvarDados(){

try{

localStorage.setItem("xp",xp);
localStorage.setItem("contador",contador);
localStorage.setItem("sequencia",sequencia);
localStorage.setItem("ultimaData",ultimaData);
localStorage.setItem("favorita",favorita);

}catch(e){

console.log("Armazenamento indisponível");

}

}

function dataHoje(){

const d = new Date();

return d.getFullYear() +
"-" +
String(d.getMonth()+1).padStart(2,"0") +
"-" +
String(d.getDate()).padStart(2,"0");

}

function dataOntem(){

const d = new Date();

d.setDate(d.getDate()-1);

return d.getFullYear() +
"-" +
String(d.getMonth()+1).padStart(2,"0") +
"-" +
String(d.getDate()).padStart(2,"0");

}

function atualizarTela(){

document.getElementById("xp").innerText = xp;

document.getElementById("contador").innerText = contador;

document.getElementById("sequencia").innerText = sequencia;

atualizarBonus();

}

function atualizarBonus(){

const bonus =
document.getElementById("bonus");

if(ultimaData === dataHoje()){

bonus.innerText =
"✅ Bônus de hoje já foi recebido! Volte amanhã 🔥";

}else{

bonus.innerText =
"🎁 Bônus diário disponível! +5 XP";

}

}

function novaFrase(){

const indice =
Math.floor(Math.random()*frases.length);

document.getElementById("frase").innerText =
frases[indice];

contador++;

xp++;

const hoje = dataHoje();

if(ultimaData !== hoje){

if(ultimaData === dataOntem()){

sequencia++;

}else{

sequencia = 1;

}

xp += 5;

ultimaData = hoje;

mostrarMensagem(
"🎁 +5 XP de bônus! 🔥 Sequência: " +
sequencia +
" dia(s)"
);

}else{

mostrarMensagem(
"😂 Nova frase! +1 XP"
);

}

salvarDados();

atualizarTela();

}

function favoritar(){

const frase =
document.getElementById("frase").innerText;

if(frase.includes("Clique no botão")){

mostrarMensagem(
"😂 Primeiro descubra uma frase!"
);

return;

}

favorita = frase;

salvarDados();

mostrarMensagem(
"❤️ Frase favorita salva!"
);

}

function compartilhar(){

const frase =
document.getElementById("frase").innerText;

if(frase.includes("Clique no botão")){

mostrarMensagem(
"😂 Primeiro descubra uma frase!"
);

return;

}

const texto =
frase +
"\n\n😂 Botão do Real";

if(navigator.share){

navigator.share({

title:"Botão do Real",

text:texto

}).catch(function(){});

}else{

try{

if(navigator.clipboard){

navigator.clipboard.writeText(texto);

mostrarMensagem(
"📋 Frase copiada!"
);

}else{

alert(texto);

}

}catch(e){

alert(texto);

}

}

}

function missao(){

const hoje = dataHoje();

if(ultimaData === hoje){

alert(
"🎯 MISSÃO DO DIA\n\n" +
"✅ Você já pegou o bônus de hoje!\n\n" +
"🔥 Volte amanhã para continuar sua sequência."
);

}else{

alert(
"🎯 MISSÃO DO DIA\n\n" +
"Aperte o botão e descubra uma frase.\n\n" +
"🎁 Você ganhará +5 XP de bônus hoje!\n\n" +
"🔥 Volte amanhã para manter sua sequência."
);

}

}

function sobre(){

alert(

"💰 BOTÃO DO REAL\n\n" +

"😂 Frases engraçadas\n" +
"🔥 Sequência diária\n" +
"⭐ Sistema de XP\n" +
"❤️ Favoritos\n" +
"📤 Compartilhamento\n" +
"🎯 Missões\n\n" +

"Volte todos os dias para aumentar sua sequência!\n\n" +

"⚠️ O botão é uma brincadeira e não entrega dinheiro real."

);

}

let tempoMensagem;

function mostrarMensagem(texto){

const elemento =
document.getElementById("mensagem");

elemento.innerText = texto;

elemento.style.display = "block";

clearTimeout(tempoMensagem);

tempoMensagem =
setTimeout(function(){

elemento.style.display = "none";

},2500);

}

carregarDados();

atualizarTela();

</script>

</body>
</html>
